<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<title>SPE AI Family Studio — 3D Viewer v3</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#080c18;color:#e2e8f0;font-family:'SF Mono',ui-monospace,monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{height:46px;background:#0c1022;border-bottom:1px solid #182040;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;gap:8px;}
.brand{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.brand-icon{width:26px;height:26px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;}
.brand-name{font-size:11px;font-weight:700;color:#f1f5f9;letter-spacing:0.03em;}
.brand-ver{font-size:9px;color:#3b4a6b;margin-left:3px;}
.toolbar{display:flex;gap:3px;align-items:center;flex-wrap:wrap;}
.tbtn{padding:3px 8px;border-radius:4px;border:1px solid #182040;background:#0f1628;color:#64748b;font-size:9px;cursor:pointer;font-family:inherit;transition:all 0.1s;white-space:nowrap;}
.tbtn:hover{background:#182040;color:#cbd5e1;}
.tbtn.active{background:#1e3a8a;border-color:#3b82f6;color:#93c5fd;}
.tbtn.green{background:#052e16;border-color:#166534;color:#4ade80;}
.tbtn.green:hover{background:#14532d;}
.sep{width:1px;height:20px;background:#182040;margin:0 2px;flex-shrink:0;}
.main{display:flex;flex:1;overflow:hidden;}
.sidebar{width:200px;background:#0c1022;border-right:1px solid #182040;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
.sb-sec{border-bottom:1px solid #182040;padding:6px 8px;overflow-y:auto;}
.sb-sec.grow{flex:1;}
.sb-lbl{font-size:8px;color:#3b4a6b;font-weight:700;letter-spacing:0.1em;margin-bottom:5px;text-transform:uppercase;}
.ci{padding:5px 6px;border-radius:4px;cursor:pointer;border:1px solid transparent;margin-bottom:2px;transition:all 0.1s;}
.ci:hover{background:#0f1628;}
.ci.sel{background:rgba(37,99,235,0.12);border-color:#2563eb;}
.ci-row{display:flex;align-items:center;gap:5px;}
.ci-dot{width:7px;height:7px;border-radius:1px;flex-shrink:0;}
.ci-name{font-size:10px;color:#94a3b8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ci-badge{font-size:7px;padding:1px 3px;border-radius:2px;background:#182040;color:#475569;flex-shrink:0;}
.ci-badge.void{background:rgba(239,68,68,0.15);color:#f87171;}
.ci-badge.cyl{background:rgba(168,85,247,0.15);color:#c084fc;}
.ci-badge.sph{background:rgba(34,197,94,0.15);color:#4ade80;}
.ci-badge.rev{background:rgba(251,146,60,0.15);color:#fb923c;}
.ci-badge.swp{background:rgba(56,189,248,0.15);color:#38bdf8;}
.ci-size{font-size:8px;color:#1e3a5f;margin-top:1px;padding-left:12px;}
.mi{display:flex;align-items:center;gap:5px;margin-bottom:4px;}
.ms{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.mn{font-size:9px;color:#475569;}
.pi{display:flex;justify-content:space-between;margin-bottom:2px;font-size:8px;}
.pk{color:#1e3a5f;} .pv{color:#334155;}
.canvas-wrap{flex:1;position:relative;overflow:hidden;}
canvas{display:block;width:100%!important;height:100%!important;}
.ov-tl{position:absolute;top:8px;left:8px;pointer-events:none;}
.ov-tr{position:absolute;top:8px;right:8px;display:flex;gap:3px;}
.ov-bl{position:absolute;bottom:8px;left:8px;pointer-events:none;}
.ov-br{position:absolute;bottom:8px;right:8px;pointer-events:none;}
.pill{background:rgba(8,12,24,0.9);backdrop-filter:blur(8px);border:1px solid #182040;border-radius:6px;padding:4px 9px;font-size:10px;color:#64748b;}
.pill b{color:#38bdf8;} .pill .cat{color:#3b4a6b;}
.vbtn{padding:3px 8px;font-size:9px;border-radius:4px;border:1px solid #182040;background:rgba(8,12,24,0.9);backdrop-filter:blur(6px);color:#475569;cursor:pointer;font-family:inherit;transition:all 0.1s;}
.vbtn:hover{color:#e2e8f0;background:#182040;}
.vbtn.active{background:#1e3a8a;border-color:#3b82f6;color:#93c5fd;}
.axis-leg{display:flex;gap:6px;align-items:center;font-size:9px;color:#1e3a5f;}
.ad{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:2px;}
.info-panel{position:absolute;top:44px;right:8px;width:170px;background:rgba(8,12,24,0.95);backdrop-filter:blur(10px);border:1px solid #182040;border-radius:7px;padding:9px;display:none;z-index:20;}
.info-panel.show{display:block;}
.ih{font-size:10px;font-weight:600;color:#e2e8f0;margin-bottom:7px;border-bottom:1px solid #182040;padding-bottom:5px;}
.ir{display:flex;justify-content:space-between;font-size:9px;margin-bottom:3px;}
.ik{color:#334155;} .iv{color:#38bdf8;text-align:right;max-width:100px;overflow:hidden;text-overflow:ellipsis;}
.geo-legend{position:absolute;bottom:44px;left:8px;background:rgba(8,12,24,0.88);border:1px solid #182040;border-radius:6px;padding:6px 8px;font-size:8px;pointer-events:none;}

</div>

// ── THREE.JS SETUP ────────────────────────────────────────
const canvas=document.getElementById('canvas');
const wrap=document.getElementById('wrap');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080c18);
scene.fog=new THREE.Fog(0x080c18,8000,18000);

const camera=new THREE.PerspectiveCamera(40,1,5,30000);
camera.up.set(0,0,1);

const amb=new THREE.AmbientLight(0xcce0ff,0.5); scene.add(amb);
const sun=new THREE.DirectionalLight(0xfff5e0,1.2);
sun.position.set(2000,-1500,3500);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=10;sun.shadow.camera.far=12000;
sun.shadow.camera.left=-2500;sun.shadow.camera.right=2500;
sun.shadow.camera.top=2500;sun.shadow.camera.bottom=-2500;
scene.add(sun);

const rim=new THREE.DirectionalLight(0xffffff,0.15);rim.position.set(0,3000,-500);scene.add(rim);

// Grid & Floor
const gridObj=new THREE.GridHelper(8000,60,0x182040,0x0f1628);
gridObj.rotation.x=Math.PI/2;gridObj.position.z=-1;scene.add(gridObj);

floorMesh.receiveShadow=true;floorMesh.position.z=-2;scene.add(floorMesh);

let meshMap={},selectedId=null,currentData=null,bbLine=null,edgeObjects=[];
let showWire=false,showBB=true,showShadow=true,showEdge=true,showGrid=true;

// ── GEOMETRY FACTORY ──────────────────────────────────────
function makeGeo(comp){
  const {w,d,h}=comp.dim;
  const r=w/2;
  switch(comp.geo){
    case 'cylinder':{
      const g=new THREE.CylinderGeometry(r,r*1.02,h,16);
      g.applyMatrix4(new THREE.Matrix4().makeRotationX(Math.PI/2));
      return g;
    }
    case 'sphere':{
      const g=new THREE.SphereGeometry(r,24,16);
      return g;
    }
    case 'cone':{
      const g=new THREE.ConeGeometry(r,h,16);
      g.applyMatrix4(new THREE.Matrix4().makeRotationX(Math.PI/2));
      return g;
    }
    case 'wedge':{
      // Triangle prism (wedge)
      const shape=new THREE.Shape();
      shape.moveTo(-w/2,-d/2);shape.lineTo(w/2,-d/2);
      shape.lineTo(w/2,d/2);shape.closePath();
      const extSettings={depth:h,bevelEnabled:false};
      const g=new THREE.ExtrudeGeometry(shape,extSettings);
      g.applyMatrix4(new THREE.Matrix4().makeRotationX(Math.PI/2));
      return g;
    }
    case 'revolve':{
      // Vase profile for revolve demo
      const pts=[];
      const segs=12;
      for(let i=0;i<=segs;i++){
        const t=i/segs;
        const rr=r*(0.3+0.7*Math.sin(t*Math.PI)*Math.sin(t*Math.PI)*0.9+0.1);
        pts.push(new THREE.Vector2(rr,t*h-h/2));
      }
      return new THREE.LatheGeometry(pts,24);
    }
    case 'sweep':{
      // Swept tube along arc
      const curve=new THREE.CatmullRomCurve3([
        new THREE.Vector3(-w/2,0,0),new THREE.Vector3(0,d/2,h/3),
        new THREE.Vector3(w/2,0,h*0.7),new THREE.Vector3(w/3,-d/3,h)
      ]);
      return new THREE.TubeGeometry(curve,20,Math.min(w,d)/4,8,false);
    }
    case 'void':
    case 'box':
    default:
      return new THREE.BoxGeometry(w,d,h);
  }
}

function makeMat(comp,color,isVoid){
  const isMetal=comp.mat&&(comp.mat.toLowerCase().includes('steel')||comp.mat.toLowerCase().includes('metal')||comp.mat.toLowerCase().includes('alumin'));
  const isFabric=comp.mat&&(comp.mat.toLowerCase().includes('fabric')||comp.mat.toLowerCase().includes('cloth')||comp.mat.toLowerCase().includes('upholstery'));
  const isGlass=comp.mat&&(comp.mat.toLowerCase().includes('glass'));

  if(isVoid) return new THREE.MeshStandardMaterial({color:0xef4444,transparent:true,opacity:0.3,side:THREE.DoubleSide,roughness:0.4,depthWrite:false});
  if(isGlass) return new THREE.MeshPhysicalMaterial({color:new THREE.Color(color),transparent:true,opacity:0.3,roughness:0.05,metalness:0,transmission:0.9,side:THREE.DoubleSide});

  return new THREE.MeshStandardMaterial({
    color:new THREE.Color(color),
    side:THREE.DoubleSide,
    roughness:isMetal?0.25:isFabric?0.95:0.55,
    metalness:isMetal?0.7:0,
    wireframe:showWire
  });
}

function buildScene(data){
  // cleanup
  Object.values(meshMap).forEach(({mesh})=>{
    scene.remove(mesh);
    mesh.geometry.dispose();
    if(Array.isArray(mesh.material))mesh.material.forEach(m=>m.dispose());
    else mesh.material.dispose();
  });
  meshMap={};
  if(bbLine){scene.remove(bbLine);bbLine=null;}

  currentData=data;selectedId=null;
  document.getElementById('info-panel').classList.remove('show');
  document.getElementById('fn').textContent=data.family_name;
  document.getElementById('fc').textContent=data.category;
  const od=data.overall_dimensions;
  document.getElementById('dim-txt').textContent=`${od.width}W × ${od.depth}D × ${od.height}H`;
  document.getElementById('comp-count').textContent=data.components.length;

  data.components.forEach(comp=>{
    const isVoid=comp.isVoid||comp.geo==='void';
    const color=data.materials[comp.mat]||'#888888';
    const geo=makeGeo(comp);
    const mat=makeMat(comp,color,isVoid);
    const mesh=new THREE.Mesh(geo,mat);

    const {x,y,z}=comp.pos;
    const h=comp.dim.h;

    // Position: z = floor z + half height (for most geos)
    const isCentered=['sphere','revolve'].includes(comp.geo);
    mesh.position.set(x,y,z+(isCentered?h/2:h/2));

    // Rotation
    const rot=comp.rot||{x:0,y:0,z:0};
    mesh.rotation.set(
      THREE.MathUtils.degToRad(rot.x||0),
      THREE.MathUtils.degToRad(rot.y||0),
      THREE.MathUtils.degToRad(rot.z||0)
    );

    mesh.castShadow=!isVoid&&showShadow;
    mesh.receiveShadow=showShadow;
    mesh.userData={id:comp.id,comp,isVoid};
    scene.add(mesh);

    // Edge lines
    if(showEdge&&!showWire){
      try{
        const edges=new THREE.EdgesGeometry(geo,20);
        const emat=new THREE.LineBasicMaterial({color:isVoid?0xf87171:0x000000,opacity:isVoid?0.8:0.2,transparent:true});
        const elines=new THREE.LineSegments(edges,emat);
        mesh.add(elines);
      }catch(e){}
    }

    meshMap[comp.id]={mesh,comp,origColor:color,isVoid};
  });

  // Bounding box
  const bbg=new THREE.BoxGeometry(od.width,od.depth,od.height);
  const bbe=new THREE.EdgesGeometry(bbg);
  bbLine=new THREE.LineSegments(bbe,new THREE.LineDashedMaterial({color:0x1e3a5f,dashSize:80,gapSize:40,opacity:0.5,transparent:true}));
  bbLine.computeLineDistances();
  bbLine.position.set(0,0,od.height/2);
  bbLine.visible=showBB;
  scene.add(bbLine);

  renderSidebar();
  setView('3d');
}

function selectComp(id){
  selectedId=id;
  Object.values(meshMap).forEach(({mesh,isVoid})=>{
    if(!isVoid){mesh.material.emissive=new THREE.Color(0);mesh.material.emissiveIntensity=0;}
  });
  const panel=document.getElementById('info-panel');
  if(id&&meshMap[id]){
    const{mesh,comp,isVoid}=meshMap[id];
    if(!isVoid){mesh.material.emissive=new THREE.Color(0x1e3a8a);mesh.material.emissiveIntensity=0.4;}
    document.getElementById('i-name').textContent=comp.name;
    document.getElementById('i-geo').textContent=(comp.geo||'box').toUpperCase();
    document.getElementById('i-dim').textContent=`${comp.dim.w}×${comp.dim.d}×${comp.dim.h}`;
    document.getElementById('i-pos').textContent=`(${comp.pos.x},${comp.pos.y},${comp.pos.z})`;
    const r=comp.rot||{x:0,y:0,z:0};
    document.getElementById('i-rot').textContent=`(${r.x||0}°,${r.y||0}°,${r.z||0}°)`;
    document.getElementById('i-mat').textContent=comp.mat||'void';
    document.getElementById('i-conf').textContent=comp.confidence||'high';
    panel.classList.add('show');
  } else panel.classList.remove('show');
  renderSidebar();
}

function renderSidebar(){
  if(!currentData)return;
  // Components
  const cl=document.getElementById('comp-list');
  cl.innerHTML='';
  currentData.components.forEach(comp=>{
    const isVoid=comp.isVoid||comp.geo==='void';
    const color=currentData.materials[comp.mat]||'#ef4444';
    const isSel=comp.id===selectedId;
    const geoLabel={box:'EXT',cylinder:'CYL',sphere:'SPH',cone:'CON',wedge:'WDG',revolve:'REV',sweep:'SWP',void:'VOID'}[comp.geo]||'EXT';
    const badgeClass={cylinder:' cyl',sphere:' sph',revolve:' rev',sweep:' swp',void:' void'}[comp.geo]||'';
    const el=document.createElement('div');
    el.className='ci'+(isSel?' sel':'');
    el.innerHTML=`<div class="ci-row"><div class="ci-dot" style="background:${isVoid?'#ef4444':color}"></div><span class="ci-name">${comp.name}</span><span class="ci-badge${badgeClass}">${geoLabel}</span></div><div class="ci-size">${comp.dim.w}×${comp.dim.d}×${comp.dim.h} mm</div>`;
    el.onclick=()=>selectComp(isSel?null:comp.id);
    cl.appendChild(el);
  });
  // Materials
  const ml=document.getElementById('mat-list');
  ml.innerHTML='';
  Object.entries(currentData.materials).forEach(([name,color])=>{
    const el=document.createElement('div');
    el.className='mi';
    el.innerHTML=`<div class="ms" style="background:${color}"></div><span class="mn">${name.replace(/_/g,' ')}</span>`;
    ml.appendChild(el);
  });
  // Parameters
  const pl=document.getElementById('param-list');
  pl.innerHTML='';
  (currentData.parameters||[]).forEach(p=>{
    const el=document.createElement('div');
    el.className='pi';
    el.innerHTML=`<span class="pk">${p.name}</span><span class="pv">${p.value} ${p.unit}</span>`;
    pl.appendChild(el);
  });
}

// ── TOGGLES ───────────────────────────────────────────────
function toggleWire(){showWire=!showWire;document.getElementById('btn-wire').classList.toggle('active',showWire);Object.values(meshMap).forEach(({mesh,isVoid})=>{if(!isVoid)mesh.material.wireframe=showWire;});}
function toggleBB(){showBB=!showBB;document.getElementById('btn-bb').classList.toggle('active',showBB);if(bbLine)bbLine.visible=showBB;}
function toggleShadow(){showShadow=!showShadow;document.getElementById('btn-shadow').classList.toggle('active',showShadow);sun.castShadow=showShadow;Object.values(meshMap).forEach(({mesh})=>{mesh.castShadow=showShadow;mesh.receiveShadow=showShadow;});}
function toggleEdge(){showEdge=!showEdge;document.getElementById('btn-edge').classList.toggle('active',showEdge);if(currentData)buildScene(currentData);}
function toggleGrid(){showGrid=!showGrid;document.getElementById('btn-grid').classList.toggle('active',showGrid);gridObj.visible=showGrid;floorMesh.visible=showGrid;}

// ── CAMERA CONTROLS ───────────────────────────────────────
let isDrag=false,didDrag=false,isPan=false,prevX=0,prevY=0;
let camTarget=new THREE.Vector3(0,0,0);

canvas.addEventListener('mousedown',e=>{isDrag=true;didDrag=false;isPan=e.shiftKey||e.button===1;prevX=e.clientX;prevY=e.clientY;});
window.addEventListener('mousemove',e=>{
  if(!isDrag)return;
  const dx=e.clientX-prevX,dy=e.clientY-prevY;
  if(Math.abs(dx)>2||Math.abs(dy)>2)didDrag=true;
  prevX=e.clientX;prevY=e.clientY;
  if(isPan){
    const dir=camera.position.clone().sub(camTarget).normalize();
    const right=new THREE.Vector3().crossVectors(dir,camera.up).normalize();
    const up2=new THREE.Vector3().crossVectors(right,dir).normalize();
    const spd=camera.position.distanceTo(camTarget)*0.001;
    camTarget.addScaledVector(right,-dx*spd);camTarget.addScaledVector(up2,dy*spd);
    camera.position.addScaledVector(right,-dx*spd);camera.position.addScaledVector(up2,dy*spd);
  } else {
    const off=camera.position.clone().sub(camTarget);
    const r=off.length();
    let th=Math.atan2(off.y,off.x),ph=Math.acos(Math.max(-1,Math.min(1,off.z/r)));
    th-=dx*0.007;ph=Math.max(0.04,Math.min(Math.PI-0.04,ph-dy*0.007));
    camera.position.set(camTarget.x+r*Math.sin(ph)*Math.cos(th),camTarget.y+r*Math.sin(ph)*Math.sin(th),camTarget.z+r*Math.cos(ph));
  }
  camera.lookAt(camTarget);
});
window.addEventListener('mouseup',()=>{isDrag=false;isPan=false;});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY>0?1.1:0.9;
  const dir=camera.position.clone().sub(camTarget);
  camera.position.copy(camTarget).addScaledVector(dir.normalize(),dir.length()*f);
},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

// Raycaster click
const raycaster=new THREE.Raycaster();
canvas.addEventListener('click',e=>{
  if(didDrag)return;
  const rect=canvas.getBoundingClientRect();
  const mouse=new THREE.Vector2(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1);
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(Object.values(meshMap).map(m=>m.mesh));
  selectComp(hits.length?hits[0].object.userData.id:null);
});

// ── VIEW PRESETS ──────────────────────────────────────────
function setView(v){
  ['3d','top','front','side'].forEach(x=>document.getElementById('vb-'+x).className='vbtn'+(x===v?' active':''));
  const od=currentData?currentData.overall_dimensions:{width:1000,depth:1000,height:1000};
  const cz=od.height/2,dist=Math.max(od.width,od.depth,od.height)*2.8;
  camTarget.set(0,0,cz);
  if(v==='3d'){camera.position.set(dist*0.75,-dist*0.9,cz+dist*0.45);}
  else if(v==='top'){camera.position.set(0,0,cz+dist*1.4);camera.up.set(0,1,0);}
  else if(v==='front'){camera.position.set(0,-dist*1.3,cz);}
  else if(v==='side'){camera.position.set(dist*1.3,0,cz);}
  camera.lookAt(camTarget);
}
function resetCam(){setView('3d');}

// ── IMPORT JSON ───────────────────────────────────────────
function importJSON(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const raw=JSON.parse(ev.target.result);
      const fam=raw.family||raw;
      if(!fam.components){alert('ไม่พบ components');return;}
      const matMap={};
      (fam.materials||[]).forEach(m=>matMap[m.name]=m.color||'#888');
      const data={
        family_name:fam.family_name||file.name,category:fam.category||'Generic',
        overall_dimensions:fam.overall_dimensions||{width:1000,depth:1000,height:1000},
        parameters:fam.parameters||[],materials:matMap,
        components:(fam.components||[]).map(c=>({
          id:c.id,name:c.name,
          geo:c.geometry_type||c.geo||'box',
          mat:c.material||c.mat||'',
          dim:{w:c.dimensions?c.dimensions.width:c.dim.w,d:c.dimensions?c.dimensions.depth:c.dim.d,h:c.dimensions?c.dimensions.height:c.dim.h},
          pos:{x:c.position?c.position.x:c.pos.x,y:c.position?c.position.y:c.pos.y,z:c.position?c.position.z:c.pos.z},
          rot:c.rotation?{x:c.rotation.x||0,y:c.rotation.y||0,z:c.rotation.z||0}:{x:0,y:0,z:0},
          isVoid:c.geometry_type==='void'||c.geo==='void',
          confidence:c.confidence
        }))
      };
      document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('active'));
      buildScene(data);
    }catch(err){alert('อ่านไฟล์ไม่ได้: '+err.message);}
    e.target.value='';
  };
  reader.readAsText(file);
}

function loadPreset(key,btn){
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('active'));
  if(btn){btn.classList.add('active');document.getElementById('btn-bb').classList.add('active');document.getElementById('btn-shadow').classList.add('active');document.getElementById('btn-edge').classList.add('active');document.getElementById('btn-grid').classList.add('active');}
  buildScene(PRESETS[key]);
}

// ── RESIZE & RENDER ───────────────────────────────────────
function resize(){
  const w=wrap.clientWidth,h=wrap.clientHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap);resize();
(function loop(){requestAnimationFrame(loop);renderer.render(scene,camera);})();

buildScene(PRESETS.chair);
setTimeout(()=>{const h=document.getElementById('hint');if(h)h.style.opacity='0';},5000);
</script>
